services:
  funasr-stt:
    build:
      context: .
      dockerfile: Dockerfile
    image: funasr-openai-stt-service:local
    container_name: funasr-stt
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "48733:8000"
    volumes:
      - funasr-models:/models
    tmpfs:
      - /tmp:size=1g,mode=1777
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      ASR_DEVICE: cpu
      MODELSCOPE_CACHE: /models/modelscope
      HF_HOME: /models/huggingface
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  funasr-models:
